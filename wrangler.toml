name = "academyhand"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "AcademyHandContainer"
image = "./Dockerfile"
max_instances = 5

[[durable_objects.bindings]]
class_name = "AcademyHandContainer"
name = "ACADEMYHAND_CONTAINER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AcademyHandContainer"]